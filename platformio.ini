; PlatformIO project configuration — FDC+ Serial Disk Server (from-scratch rewrite)
;
; Board: DOIT ESP32 DEVKIT V1 (ESP-WROOM-32, 4 MB flash), Apple Silicon host.
;
; FRAMEWORK IS DECIDED: pure ESP-IDF ("native Espressif"), no Arduino (DESIGN.md §3).
; Source in src/ is written to the spec in DESIGN.md; until it exists, `pio run` will
; report no source (expected).

[platformio]
default_envs = devkit-espidf
; src_dir/lib_dir/include_dir use PlatformIO defaults: src/ lib/ include/

; The firmware env: pure ESP-IDF on the DEVKIT V1 board (DESIGN.md §3). The `native`
; env below is host-only for unit tests, so the board/platform settings live here — NOT
; in a shared [env] — to keep them off the native build.
[env:devkit-espidf]
platform = espressif32
board = esp32doit-devkit-v1
framework = espidf
monitor_speed = 115200
; Pin the USB-serial adapter (this host has several attached) so upload/monitor always
; target the FDC+ SDS device — ESP32-D0WD-V3, MAC 28:05:a5:31:75:0c.
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
; Faster flashing (verified reachable at this rate; default is 115200).
upload_speed = 460800
; Custom partition table: dual OTA app slots + NVS, sized for 4 MB flash.
board_build.partitions = partitions.csv
; ESP-IDF configuration goes in sdkconfig.defaults.

; Host-native env for pure-logic unit tests (plan M3): `pio test -e native`. Compiles
; only the ESP-IDF-free headers (protocol.h, wildcard.h) + the test — no board, no src.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu11 -Iinclude -Wall -Wextra
