; PlatformIO project configuration — FDC+ Serial Disk Server (from-scratch rewrite)
;
; Board: DOIT ESP32 DEVKIT V1 (ESP-WROOM-32, 4 MB flash), Apple Silicon host.
;
; FRAMEWORK IS DECIDED: pure ESP-IDF ("native Espressif"), no Arduino (DESIGN.md §3).
; Source in src/ is written to the spec in DESIGN.md; until it exists, `pio run` will
; report no source (expected).

[platformio]
default_envs = devkit-espidf
; src_dir/lib_dir/include_dir use PlatformIO defaults: src/ lib/ include/

[env]
platform = espressif32
board = esp32doit-devkit-v1
monitor_speed = 115200
; Pin the USB-serial adapter (this host has several attached) so upload/monitor always
; target the FDC+ SDS device — ESP32-D0WD-V3, MAC 28:05:a5:31:75:0c.
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
; Faster flashing (verified reachable at this rate; default is 115200).
upload_speed = 460800
; Custom partition table: dual OTA app slots + NVS, sized for 4 MB flash.
board_build.partitions = partitions.csv

[env:devkit-espidf]
framework = espidf
; ESP-IDF configuration goes in sdkconfig.defaults (create as the build takes shape).
